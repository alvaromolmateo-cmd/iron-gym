services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      SQLITE_PATH: /data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/data

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend-data:
