{% extends "common/base_intranet.html" %}
{% load crispy_forms_tags %}

{% block main_content %}
<!-- UD4.2c - Formulario compartido de creación y actualización. -->
{% if object %}
<h2>{{ titulo_actualizacion }}</h2>
{% else %}
<h2>{{ titulo_creacion }}</h2>
{% endif %}
<!-- UD4.4b - Crispy incluye el token CSRF; validaciones en el servidor. -->
<form method="post" enctype="multipart/form-data" novalidate>
    {% crispy form %}
    <input type="submit" class="btn btn-success" value="{{ object|yesno:'Actualizar,Crear' }}">
    {% if object and url_borrado %}
    <a class="btn btn-danger" href="{% url url_borrado object.pk %}">Eliminar</a>
    {% endif %}
</form>
{% endblock main_content %}
