<!-- UD4.2i - Conservar la ordenacion al cambiar de pagina. -->
<!-- UD3.8b - Paginación compartida por billing y core. -->
{% if is_paginated %}
<nav aria-label="Paginación">
  <ul class="pagination flex-wrap">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link" href="?page=1{% if request.GET.ordering == 'asc' or request.GET.ordering == 'desc' %}&amp;ordering={{ request.GET.ordering }}{% endif %}">Primera</a></li>
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if request.GET.ordering == 'asc' or request.GET.ordering == 'desc' %}&amp;ordering={{ request.GET.ordering }}{% endif %}">Anterior</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ page_obj.number }} de {{ paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if request.GET.ordering == 'asc' or request.GET.ordering == 'desc' %}&amp;ordering={{ request.GET.ordering }}{% endif %}">Siguiente</a></li>
    <li class="page-item"><a class="page-link" href="?page={{ paginator.num_pages }}{% if request.GET.ordering == 'asc' or request.GET.ordering == 'desc' %}&amp;ordering={{ request.GET.ordering }}{% endif %}">Última</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
