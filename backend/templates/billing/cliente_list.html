{% extends "common/base_intranet.html" %}
{% block main_content %}
<!-- UD3.8a - Lista de clientes, mostrando su representación textual. -->
<h1>Lista de clientes</h1>
<ul class="list-group mb-3">
{% for object in object_list %}
  <li class="list-group-item"><a href="{% url 'cliente_detail' object.pk %}">{{ object }}</a></li>
{% empty %}
  <li class="list-group-item">No hay clientes registrados.</li>
{% endfor %}
</ul>
{% endblock main_content %}
