{% extends "common/base_intranet.html" %}
{% block main_content %}
<!-- UD3.8a - Lista de perfiles, mostrando su representación textual. -->
<h1>Lista de perfiles</h1>
<ul class="list-group mb-3">
{% for object in object_list %}
  <li class="list-group-item"><a href="{% url 'perfil_detail' object.pk %}">{{ object }}</a></li>
{% empty %}
  <li class="list-group-item">No hay perfiles registrados.</li>
{% endfor %}
</ul>
<!-- UD3.8b - Navegación entre páginas. -->
{% include "common/pagination.html" %}
{% endblock main_content %}
